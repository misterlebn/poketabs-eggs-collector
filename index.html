<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokeTabs Eggs Collector</title>
<style>
:root{--ink:#4a2f22;--paper:#fff8ee;--cream:#f6e9d8;--gold:#f2b632;--blue:#5f9be8;--red:#e0604f;--green:#5fb86a;--pink:#ef8fb6;--shadow:0 3px 0 #4a2f22}
*{box-sizing:border-box}
body{margin:0;background:#e9d6bf;color:var(--ink);font:600 14px/1.35 "Trebuchet MS",Verdana,sans-serif}
img{image-rendering:pixelated}
button{font:inherit;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:10px;padding:5px 10px;cursor:pointer;box-shadow:var(--shadow)}
button:hover{background:#fff3c9}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
button.go{background:var(--gold)}
button.sm{padding:2px 7px;font-size:12px;border-width:2px;border-radius:8px;box-shadow:0 2px 0 var(--ink)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;background:var(--paper);border-bottom:4px solid var(--ink);position:sticky;top:0;z-index:20}
.logo{font:900 22px/1 "Trebuchet MS",sans-serif;letter-spacing:1px;color:var(--red);text-shadow:2px 2px 0 var(--ink)}
.logo span{display:block;font-size:12px;color:var(--blue);letter-spacing:3px;text-shadow:1px 1px 0 var(--ink)}
.stats{display:flex;gap:14px;font-size:15px}
.stats img{width:22px;height:22px;vertical-align:-5px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav button.on{background:var(--gold)}
main{max-width:1180px;margin:0 auto;padding:14px}
section[hidden]{display:none}
h3{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:10px}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:14px;padding:12px;box-shadow:0 5px 0 var(--ink)}
/* ---------- nurserie ---------- */
.room{border:4px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:0 6px 0 var(--ink)}
.wall{height:120px;background:linear-gradient(#f9e3d3,#f3cfba);border-bottom:6px solid #c99a7a;position:relative}
.wall .deco{position:absolute;bottom:0}
.floor{background:repeating-linear-gradient(90deg,#d7a874 0 58px,#cf9e69 58px 60px),#d7a874;padding:14px;display:grid;gap:14px}
.zone{background:rgba(255,248,238,.88);border:3px solid var(--ink);border-radius:12px;padding:10px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.st{position:relative;width:170px;min-height:180px;background:rgba(255,255,255,.55);border:3px dashed #b88a63;border-radius:12px;padding:6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.st:hover{border-color:var(--ink);background:#fff}
.st .lvl{position:absolute;top:4px;left:6px;font-size:11px;background:var(--ink);color:#fff;border-radius:6px;padding:1px 6px}
.st .cap{font-size:11px;min-height:28px;margin-top:4px}
.bar{width:100%;height:9px;border:2px solid var(--ink);border-radius:6px;background:#fff;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:0;background:var(--green)}
.bar.xp i{background:var(--blue)}
.nest .base{width:140px}
.nest .pair{position:absolute;bottom:58px;display:flex;gap:0;z-index:2}
.egg{display:inline-block;position:relative;overflow:hidden;flex:none;vertical-align:middle}
.egg img{position:absolute;max-width:none}
.egg .ck{position:absolute;left:0;top:0;width:100%;height:100%;background:url(sprites/Graphics/Battlers/Eggs/000_cracks.png) no-repeat;image-rendering:pixelated}
.egg-ico{position:absolute;cursor:pointer;top:6px;width:46px;z-index:3;animation:bob 1s ease-in-out infinite;filter:drop-shadow(0 0 6px #fff7a8)}
.egg-ico::after{content:""}
@keyframes bob{50%{transform:translateY(-7px)}}
.readyTag{position:absolute;top:2px;right:6px;font-size:11px;background:var(--gold);border:2px solid var(--ink);border-radius:8px;padding:0 5px}
.spr{display:inline-block;overflow:hidden;position:relative;flex:none}
.spr img{position:absolute;left:0;top:0;animation:walk .8s steps(4) infinite}
.spr.still img{animation:none}
.spr.miss{background:radial-gradient(circle,#ccc 40%,transparent 42%)}
.spr.miss img{display:none}
@keyframes walk{to{left:var(--w)}}
.inc .base{width:84px;height:135px;background:url(assets/incubators.png) no-repeat;background-size:672px 135px;position:relative}
.inc .eggs{position:absolute;left:11px;right:11px;bottom:22px;display:flex;flex-wrap:wrap-reverse;justify-content:center;gap:1px}
.egg.ok{animation:wig .5s ease-in-out infinite}
@keyframes wig{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.ball .base{height:96px}
.ball .trainees{display:flex;gap:2px;position:absolute;bottom:58px}
.ball .trainees .spr{animation:punch .45s ease-in-out infinite alternate}
@keyframes punch{to{transform:translateX(6px)}}
.eggbag{display:flex;flex-wrap:wrap;gap:6px}
.eggchip{display:flex;flex-direction:column;align-items:center;width:64px;font-size:10px;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:3px}

/* ---------- cartes ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px}
.card{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px}
.card.pick{cursor:pointer}
.card.pick:hover{background:#fff3c9}
.card.busy{opacity:.55}
.card.sel{outline:4px solid var(--gold)}
.card .nm{font-size:14px}
.card .sh{position:absolute;top:4px;right:6px;color:#e8a400}
.card .tag{position:absolute;top:4px;left:6px;font-size:10px;background:#eee;border-radius:6px;padding:0 5px}
.types{display:flex;gap:3px}
.ty{font-size:10px;color:#fff;border-radius:6px;padding:0 6px;text-shadow:1px 1px 0 rgba(0,0,0,.35)}
.genes{display:grid;grid-template-columns:auto 1fr;gap:1px 5px;width:100%;font-size:10px;align-items:center}
.genes b{display:block;height:5px;background:#eee;border-radius:3px;overflow:hidden}
.genes b i{display:block;height:100%;background:var(--pink)}
.mut{color:#c03cff}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.ach{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px;opacity:.75}
.ach.ok{opacity:1;background:#fff8d8;border-color:#b8860b}
.ach .ai{font-size:28px}
.ach .at{display:flex;flex-direction:column;gap:2px;font-size:12px;flex:1}
.ach .at b{font-size:14px}
.ach .price img{width:14px;height:14px}
.pkb{position:absolute;top:22px;right:4px;font-size:9px;font-weight:900;color:#fff;background:#d6338a;border-radius:6px;padding:0 5px;letter-spacing:.5px}
.banner.pk{background:#ffd1e8}
/* ---------- combat ---------- */
.bhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bhead .title{font-size:18px}
.biome{font-size:12px;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:2px 8px}
#bcv{width:100%;max-width:1152px;border:4px solid var(--ink);border-radius:12px;display:block;background:#7cc46a;image-rendering:pixelated;cursor:crosshair}
.roster{display:flex;gap:8px;overflow-x:auto;padding:10px 2px}
.rcard{flex:none;width:92px;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:4px;text-align:center;font-size:11px;cursor:pointer}
.rcard.sel{background:var(--gold)}
.rcard.on{opacity:.4}
.rcard.busy{opacity:.3;cursor:not-allowed}
/* ---------- boutique ---------- */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.item{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center}
.item .ic{width:56px;height:56px;display:flex;align-items:center;justify-content:center;flex:none}
.item .ic img{max-width:56px;max-height:56px}
.item .ic .egg img{max-width:none;max-height:none}
.market{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mk{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;text-align:center;position:relative}
.mk b{font-size:12px}
.mk.leg{background:linear-gradient(#fff8d8,#fff);border-color:#b8860b}
.mk .lg{position:absolute;top:3px;left:4px;font-size:9px;background:#f2b632;border:1px solid var(--ink);border-radius:5px;padding:0 4px}
.playfield{position:relative;isolation:isolate;height:220px;border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at center,#f6dcc0 0 55%,#ecc9a2 56% 100%);border:3px solid #c99a7a}
.walker{position:absolute;left:0;top:0;cursor:pointer;will-change:transform}
.walker::before{content:"";position:absolute;left:16px;bottom:4px;width:24px;height:7px;border-radius:50%;background:rgba(0,0,0,.18)}
.walker:hover .spr{filter:drop-shadow(0 0 4px #fff)}
.pdeco{position:absolute;pointer-events:none}
.hearts{position:absolute;bottom:112px;left:50%;transform:translateX(-50%);width:64px;height:30px;pointer-events:none;z-index:3}
.hearts span{position:absolute;bottom:0;color:#ff5c8a;font-size:15px;opacity:0;animation:heart 2.4s ease-out infinite;text-shadow:0 1px 0 #7a2040}
.hearts span:nth-child(1){left:8px}.hearts span:nth-child(2){left:26px;animation-delay:.8s}.hearts span:nth-child(3){left:44px;animation-delay:1.6s}
@keyframes heart{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-28px) scale(1.15)}}
.item .tx{flex:1;font-size:12px}
.item .tx b{font-size:14px;display:block}
.price{display:inline-flex;align-items:center;gap:3px}
.price img{width:16px;height:16px}
/* ---------- pokédex ---------- */
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.dc{background:#fff;border:2px solid var(--ink);border-radius:8px;text-align:center;font-size:9px;padding:2px;cursor:pointer;position:relative}
.dc .spr{margin:0 auto}
.dc.un .spr img{filter:brightness(0);opacity:.3}
.dc.seen .spr img{filter:grayscale(1);opacity:.6}
.dc .s{position:absolute;top:0;right:2px;color:#e8a400}
/* ---------- modale, toasts ---------- */
#modal{position:fixed;inset:0;background:rgba(40,25,15,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
#modal[hidden]{display:none}
.mbox{background:var(--paper);border:4px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 var(--ink);max-width:900px;width:100%;max-height:88vh;overflow:auto;padding:16px;position:relative}
.mbox .x{position:absolute;top:8px;right:8px}
.mbox h2{margin:0 0 10px}
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:60}
.toast{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:8px 12px;box-shadow:var(--shadow);animation:tin .25s}
@keyframes tin{from{transform:translateX(40px);opacity:0}}
#tip{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#fffbe0;border:3px solid var(--ink);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);z-index:40;max-width:560px;display:flex;gap:10px;align-items:center}
#tip[hidden]{display:none}
.hatch{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.banner{font-weight:900;padding:2px 8px;border-radius:8px;border:2px solid var(--ink)}
.banner.m{background:#f0d6ff}
.banner.s{background:#fff1a8}
.muted{opacity:.7;font-size:12px}
.flexr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.slotrow{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:6px;margin-bottom:6px}

.slotrow .bar{flex:1}
</style>
</head>
<body>
<header>
  <div class="logo">POKETABS<span>EGGS COLLECTOR</span></div>
  <div class="stats">
    <span><img src="sprites/Graphics/Items/COIN_GOLD.png" alt=""> <b id="coins">0</b></span>
    <span>🥚 <b id="eggN">0</b></span>
    <span>⚔ Tableau <b id="stN">1</b></span>
  </div>
  <nav>
    <button data-tab="nursery" class="on">Nurserie</button>
    <button data-tab="team">Pokémon</button>
    <button data-tab="battle">Combat</button>
    <button data-tab="shop">Boutique</button>
    <button data-tab="dex">Pokédex</button>
    <button data-tab="ach">Succès</button>
    <button data-act="cloud" id="cloudBtn">☁ Compte</button>
  </nav>
</header>
<main>
  <section id="tab-nursery"></section>
  <section id="tab-team" hidden></section>
  <section id="tab-battle" hidden>
    <div class="bhead" id="bhead"></div>
    <canvas id="bcv" width="960" height="540"></canvas>
    <div class="roster" id="roster"></div>
  </section>
  <section id="tab-shop" hidden></section>
  <section id="tab-dex" hidden></section>
  <section id="tab-ach" hidden></section>
</main>
<div id="modal" hidden><div class="mbox"><button class="x sm" data-act="closeModal">✕</button><div id="mbody"></div></div></div>
<div id="toasts"></div>
<div id="tip" hidden><span id="tipTx"></span><button class="sm" data-act="tipOk">OK</button></div>

<script>

const VERSION='V00.07.00';

  pkr:0.002,       // chance qu'un œuf attrape le Pokérus (1 sur 500), hérité ensuite par tous les descendants
  pkXp:1.5,        // Pokérus : multiplicateur d'XP

  trainXP:1.6,     // XP par seconde d'un punching-ball niveau 1

const SPR='sprites/';

const COIN='<img src="sprites/Graphics/Items/COIN_GOLD.png" alt="">';

function noiseFn(seed){const R=rng(seed);const P=new Float32Array(64*64).map(()=>R());const v=(x,y)=>P[((y&63)*64)+(x&63)];
  return(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,sx=xf*xf*(3-2*xf),sy=yf*yf*(3-2*yf);const a=v(xi,yi),b=v(xi+1,yi),c=v(xi,yi+1),d=v(xi+1,yi+1);return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy}}
function genMap(stage){
  const R=rng(stage*9973+17),bi=biomeOf(stage);
  const liq=new Uint8Array(GW*GH),tree=new Uint8Array(GW*GH),bridge=new Uint8Array(GW*GH);
  const I=(x,y)=>y*GW+x;
  const river=stage>1&&R()<.8;
  if(river){let x=12+R()*6;const w=R()<.35?3:2;for(let y=0;y<GH;y++){x=clamp(x+(R()-.5)*1.4,11,GW-14);for(let k=0;k<w;k++)liq[I(Math.round(x)+k,y)]=1}
    const nb=1+Math.floor(R()*3),rows=[];while(rows.length<nb){const r=2+Math.floor(R()*(GH-4));if(rows.every(q=>Math.abs(q-r)>3))rows.push(r)}
    rows.forEach(r=>{for(let x2=0;x2<GW;x2++)if(liq[I(x2,r)])bridge[I(x2,r)]=1})}
  const ponds=Math.floor(R()*(river?2:3));
  for(let p=0;p<ponds;p++){const cx=11+Math.floor(R()*10),cy=2+Math.floor(R()*(GH-4)),rx=1+R()*1.6,ry=1+R()*1.2;for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){if(((x-cx)/rx)**2+((y-cy)/ry)**2<=1)liq[I(x,y)]=1}}
  for(let i=0;i<GW*GH;i++)if(bridge[i])liq[i]=1;
  const nearB=(x,y)=>{for(let dy=-1;dy<=1;dy++)for(let dx=-2;dx<=2;dx++){const xx=x+dx,yy=y+dy;if(xx>=0&&yy>=0&&xx<GW&&yy<GH&&bridge[I(xx,yy)])return true}return false};
  const nearLiq=(x,y)=>{for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const xx=x+dx,yy=y+dy;if(xx>=0&&yy>=0&&xx<GW&&yy<GH&&liq[I(xx,yy)])return true}return false};

  for(let y=2;y<GH;y++)for(let x=1;x<GW-1;x++){const zone=x<=PZ||x>=EZ;const p=bi.dens*(zone?.35:1);if(R()<p){const v=bi.trees[Math.floor(R()*bi.trees.length)];if(v[2]===2&&y<3)continue;if(!nearLiq(x,y)&&!nearB(x,y)&&trees.every(t=>Math.max(Math.abs(t.x-x),Math.abs(t.y-y))>=2)){tree[I(x,y)]=1;trees.push({x,y,v})}}}

function drawTerrain(M){

  const im=x.createImageData(CW,CH),D=im.data;const nz=noiseFn(M.seed),nz2=noiseFn(M.seed+7);
  const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const G=bi.g.map(hex),S=hex(bi.sh),L1=hex(bi.liq),L2=hex(bi.liq2);
  const lq=(tx,ty)=>tx<0||ty<0||tx>=GW||ty>=GH?0:M.liq[ty*GW+tx];
  for(let py=0;py<CH;py+=2)for(let px=0;px<CW;px+=2){
    const fx=px/TW-.5,fy=py/TW-.5,ix=Math.floor(fx),iy=Math.floor(fy),ax=fx-ix,ay=fy-iy;
    const sx=ax*ax*(3-2*ax),sy=ay*ay*(3-2*ay);

    w+=(nz(px/22,py/22)-.5)*.3+(nz2(px/7,py/7)-.5)*.08;

  }

  const R=rng(M.seed+3);x.fillStyle='rgba(255,255,255,.35)';
  for(let i=0;i<GW*GH;i++)if(M.liq[i]&&!M.bridge[i]&&R()<.35){const tx=i%GW,ty=Math.floor(i/GW);x.fillRect(tx*TW+4+R()*14|0,ty*TW+6+R()*16|0,6,2)}
  /* fleurs et touffes */
  for(let k=0;k<160;k++){const tx=Math.floor(R()*GW),ty=Math.floor(R()*GH),i=ty*GW+tx;if(M.liq[i]||M.tree[i])continue;const px=tx*TW+R()*TW|0,py=ty*TW+R()*TW|0;if(R()<.5){x.fillStyle='rgba(0,0,0,.12)';x.fillRect(px,py,2,4);x.fillRect(px+3,py+1,2,3)}else{x.fillStyle=pick(bi.fl);x.fillRect(px,py,3,3);x.fillStyle='rgba(0,0,0,.15)';x.fillRect(px,py+3,3,1)}}

    const x0=xs[0]*TW-10,x1=(xs[xs.length-1]+1)*TW+10,y0=ty*TW+3,h=TW-6;
    x.fillStyle='rgba(0,0,0,.25)';x.fillRect(x0+2,y0+4,x1-x0,h);
    x.fillStyle='#9a6a3e';x.fillRect(x0,y0,x1-x0,h);
    for(let px=x0;px<x1;px+=6){x.fillStyle=(px/6)%2?'#b07c4a':'#a37145';x.fillRect(px,y0,5,h)}
    x.fillStyle='#6a4426';x.fillRect(x0,y0,x1-x0,3);x.fillRect(x0,y0+h-3,x1-x0,3);
  }
  return cv;
}

function buildField(M,sources,mode){const F=new Float32Array(GW*GH).fill(Infinity);const q=[];sources.forEach(i=>{if(F[i]!==0){F[i]=0;q.push(i)}});
  for(let h=0;h<q.length;h++){const i=q[h],x=i%GW,y=(i/GW)|0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=GW||ny>=GH)continue;const j=ny*GW+nx;if(!passable(M,j,mode))continue;if(dx&&dy&&(!passable(M,y*GW+nx,mode)||!passable(M,ny*GW+x,mode)))continue;const c=F[i]+(dx&&dy?1.414:1);if(c<F[j]){F[j]=c;q.push(j)}}}return F}

function evolveTo(n,lv,R){for(let k=0;k<3;k++){const t=evoTargets(n);if(!t.length)break;const L=evoLevel(n);const p=lv<L-4?0:lv<L?.12:clamp(.45+(lv-L)*.06,0,.95);if(R()>=p)break;n=t[Math.floor(R()*t.length)]}return n}
function genEnemies(stage,M){

function checkAch(){if(!SAVE.mons.length)return;let got=false;ACH.forEach(([id,nm,ds,rw,f,goal])=>{if(SAVE.ach[id])return;let v=0;try{v=f()}catch(e){}if(v>=goal){SAVE.ach[id]=Date.now();SAVE.coins+=rw;got=true;toast(`🏆 Succès débloqué : <b>${esc(nm)}</b> (+${fmt(rw)} pièces)`)}});if(got){dirty=true;saveGame();if(cur==='ach')renderAch()}}
function renderAch(){const n=ACH.filter(a=>SAVE.ach[a[0]]).length;
  $('tab-ach').innerHTML=`<div class="panel"><h3>Succès · ${n}/${ACH.length}</h3><div class="achgrid">${ACH.map(([id,nm,ds,rw,f,goal])=>{const ok=!!SAVE.ach[id];let v=0;try{v=f()}catch(e){}v=Math.min(v,goal);
    return `<div class="ach ${ok?'ok':''}"><div class="ai">${ok?'🏆':'🔒'}</div><div class="at"><b>${esc(nm)}</b><span>${esc(ds)}</span><div class="bar" style="height:7px"><i style="width:${v/goal*100}%"></i></div><span class="muted">${ok?'Débloqué':fmt(v)+' / '+fmt(goal)} · <span class="price">${COIN}${fmt(rw)}</span></span></div></div>`}).join('')}</div></div>`}

/* =====================================================================
   INTERFACE GÉNÉRALE
   ===================================================================== */
let cur='nursery';
function showTab(t){cur=t;document.querySelectorAll('nav button[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));['nursery','team','battle','shop','dex','ach'].forEach(k=>$('tab-'+k).hidden=k!==t);
  if(t==='nursery')renderNursery();if(t==='team')renderTeam();if(t==='shop')renderShop();if(t==='dex')renderDex();if(t==='ach')renderAch();if(t==='battle'){if(!B||B.phase==='end')setupStage(Math.min(SAVE.best+1,B&&B.phase==='end'?B.stage:SAVE.best+1));else{renderBattleHead();renderRoster()}}}
function renderTop(){$('coins').textContent=fmt(SAVE.coins);$('eggN').textContent=SAVE.eggs.length+SAVE.incs.reduce((s,c)=>s+c.slots.length,0);$('stN').textContent=SAVE.best+1}
function openModal(h){const b=$('mbody');delete b.dataset.cloud;b.innerHTML=h;$('modal').hidden=false;const x=document.querySelector('#modal .x');if(x)x.style.display=''}
function closeModal(){$('modal').hidden=true;pickState=null}
function toast(h){const d=document.createElement('div');d.className='toast';d.innerHTML=h;$('toasts').appendChild(d);setTimeout(()=>d.remove(),3200)}
function setTip(s){$('tipTx').innerHTML=s;$('tip').hidden=false}
const TUTO=['',"Clique sur le nid et place Métamorph et Pikachu ensemble : ils vont pondre un œuf.","Un œuf est prêt ! Clique dessus au-dessus du nid pour le récupérer.","Clique sur l'incubateur pour y mettre ton œuf.","L'œuf est prêt à éclore : clique sur « Tout faire éclore ».","Bravo ! Va dans l'onglet Combat et affronte le Tableau 1 avec ton armée.","Bien joué ! Gagne des pièces, achète des nids, des incubateurs et des punching-balls dans la Boutique pour agrandir ton armée."];
function setTuto(k){if(SAVE.tuto>=k)return;SAVE.tuto=k;setTip(TUTO[k]);saveGame()}
const ACT={
  closeModal,tipOk:()=>$('tip').hidden=true,
  nest:(t)=>openNest(+t.dataset.i),
  collect:(t,e)=>{e.stopPropagation();collect(+t.dataset.i);closeModal()},
  collectAll:()=>{let n=0;SAVE.nests.forEach((x,i)=>n+=collect(i,true));if(n){toast(`🥚 ${n} œuf${n>1?'s':''} récupéré${n>1?'s':''} !`);saveGame()}},
  split:(t)=>{const n=SAVE.nests[+t.dataset.i];n.a=n.b=null;n.t0=0;closeModal();dirty=true;saveGame()},
  pickMon:(t)=>{const u=+t.dataset.u;if(!pickState)return;if(!pickState.a){pickState.a=u;pickParent()}else placeCouple(u)},
  solo:()=>{if(SAVE.items.mirror<=0)return;SAVE.items.mirror--;placeCouple('solo')},
  inc:(t)=>openInc(+t.dataset.i),
  incAdd:(t)=>incAdd(+t.dataset.i,+t.dataset.k),
  incFill:(t)=>{const i=+t.dataset.i,c=SAVE.incs[i];while(SAVE.eggs.length&&c.slots.length<INC_CAP[c.lvl])incAdd(i,0,true);saveGame();openInc(i)},
  hatch:(t)=>{const r=hatchOne(+t.dataset.i,+t.dataset.k);if(r){showHatch([r]);dirty=true;saveGame()}},
  hatchAll:()=>hatchAll(),
  ball:(t)=>openBall(+t.dataset.i),
  train:(t)=>{const b=SAVE.balls[pickState.ball];if(b.mons.length<BALL_SLOT[b.lvl]){b.mons.push(+t.dataset.u);dirty=true;saveGame();openBall(pickState.ball)}},
  unTrain:(t)=>{const b=SAVE.balls[+t.dataset.i];b.mons=b.mons.filter(u=>u!==+t.dataset.u);dirty=true;saveGame();openBall(+t.dataset.i)},
  release:(t)=>{const m=mon(+t.dataset.u);if(!m)return;openModal(`<h2>Relâcher ${esc(DEX[m.n].name)} ?</h2><p>Tu gagnes ${relVal(m)} pièces. Ce choix est définitif.</p><div class="flexr"><button class="go" data-act="releaseOk" data-u="${m.u}">Relâcher</button><button data-act="closeModal">Annuler</button></div>`)},
  releaseOk:(t)=>{const u=+t.dataset.u,m=mon(u);if(!m||monStatus(u))return;SAVE.coins+=relVal(m);SAVE.mons=SAVE.mons.filter(x=>x.u!==u);closeModal();dirty=true;saveGame();renderTeam();renderTop()},
  buy:(t)=>buy(+t.dataset.i),buyEgg:(t)=>buyEgg(+t.dataset.n),
  monInfo:(t)=>{const m=mon(+t.dataset.u);if(m)openModal(`<h2>${esc(DEX[m.n].name)}</h2><div class="flexr">${monCard(m)}</div>`)},
  dexInfo:(t)=>dexInfo(+t.dataset.n),
  rsel:(t)=>{const u=+t.dataset.u;if(monStatus(u)){toast('Ce Pokémon est occupé (nid ou entraînement).');return}battleSel=u;renderRoster()},
  autoPlace:()=>autoPlace(),clearPlace:()=>{B.placed=[];renderBattleHead();renderRoster()},
  fight:()=>startFight(),speed:()=>{bSpeed=bSpeed===1?2:bSpeed===2?4:1;renderBattleHead()},flee:()=>endFight(false),
  stPrev:()=>setupStage(B.stage-1),stNext:()=>setupStage(B.stage+1),
  nextStage:()=>{closeModal();setupStage(B.stage+1)},retry:()=>{closeModal();const keep=B.placed;setupStage(B.stage);B.placed=keep.filter(p=>mon(p.u)&&!monStatus(p.u));renderBattleHead();renderRoster()},
  starter:(t)=>{const n=+t.dataset.n;addMon({n:132,lv:5,g:randGenes(5,15)});addMon({n:25,lv:5,g:randGenes(5,15)});addMon({n,lv:5,g:randGenes(8,18)});SAVE.tuto=0;closeModal();setTuto(1);dirty=true;saveGame()},
  cloud:()=>openCloud(),signIn:()=>cloudSignIn(),signOut:()=>cloudSignOut()
};
document.addEventListener('click',e=>{const tb=e.target.closest('nav button[data-tab]');if(tb){showTab(tb.dataset.tab);return}const t=e.target.closest('[data-act]');if(t&&ACT[t.dataset.act]){ACT[t.dataset.act](t,e)}else if(e.target.id==='modal'&&SAVE.mons.length)closeModal()});
$('bcv').addEventListener('click',e=>{const[x,y]=canvasPos(e);placeAt(x,y)});
function starterModal(){const S=[1,4,7,152,155,158,252,255,258,387,390,393].filter(n=>EGG_HAS.has(n));
  openModal(`<h2>Bienvenue dans PokeTabs Eggs Collector !</h2><p>Tu reçois <b>Métamorph</b> et <b>Pikachu</b> pour apprendre à faire des œufs. Choisis aussi ton starter :</p><div class="grid">${S.map(n=>`<div class="card pick" data-act="starter" data-n="${n}">${sprHTML(n,false,64)}<span class="nm">${esc(DEX[n].name)}</span>${tyHTML(DEX[n])}</div>`).join('')}</div>`);
  document.querySelector('#modal .x').style.display='none'}

const FB_CONFIG={apiKey:'AIzaSyCzLf6Ipqo8eLTzuGctQE6Na76DymMbZ3c',authDomain:'poketabs-eggs-collector.firebaseapp.com',projectId:'poketabs-eggs-collector',storageBucket:'poketabs-eggs-collector.firebasestorage.app',messagingSenderId:'299658471968',appId:'1:299658471968:web:362c88213e647a295c6a45'};
const FB_VER='10.12.2',CLOUD={on:false,user:null,busy:false,err:'',timer:0,db:null,auth:null};
const cloudReady=()=>!!FB_CONFIG.apiKey&&/^https?:$/.test(location.protocol);
const progress=s=>(s.best||0)*100000+(s.mons||[]).length*100+((s.last||0)/1e12);
function loadJs(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
async function cloudInit(){if(!cloudReady()||CLOUD.auth)return;
  try{const u='https://cdn.jsdelivr.net/npm/firebase@'+FB_VER+'/';await loadJs(u+'firebase-app-compat.js');await loadJs(u+'firebase-auth-compat.js');await loadJs(u+'firebase-firestore-compat.js');
    firebase.initializeApp(FB_CONFIG);CLOUD.auth=firebase.auth();CLOUD.db=firebase.firestore();CLOUD.on=true;CLOUD.auth.getRedirectResult().catch(()=>{});
    CLOUD.auth.onAuthStateChanged(async u=>{CLOUD.user=u;if(u)await cloudPull();renderCloud()})}catch(e){CLOUD.err='Connexion impossible';renderCloud()}}
async function cloudPull(){if(!CLOUD.user)return;CLOUD.busy=true;try{const d=await CLOUD.db.collection('saves').doc(CLOUD.user.uid).get();if(d.exists){const r=JSON.parse(d.data().data||'{}');if(progress(r)>progress(SAVE)){SAVE=Object.assign(newSave(),r);dirty=true;showTab(cur)}}try{localStorage.setItem(SAVEKEY,saveJson())}catch(e){}await cloudPush(true)}catch(e){CLOUD.err='Erreur de synchronisation'}CLOUD.busy=false}
async function cloudPush(now){if(!CLOUD.user||!CLOUD.db)return;clearTimeout(CLOUD.timer);const go=async()=>{try{await CLOUD.db.collection('saves').doc(CLOUD.user.uid).set({data:saveJson(),name:(CLOUD.user.displayName||'').split(' ')[0].slice(0,14),updated:firebase.firestore.FieldValue.serverTimestamp()});CLOUD.err=''}catch(e){CLOUD.err='Erreur de sauvegarde'}};if(now)return go();CLOUD.timer=setTimeout(go,5000)}
async function cloudSignIn(){if(!CLOUD.auth)return;const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});try{await CLOUD.auth.signInWithPopup(p)}catch(e){if(e&&/popup|iframe|operation-not-supported/.test(e.code||''))CLOUD.auth.signInWithRedirect(p)}}
async function cloudSignOut(){if(!CLOUD.auth)return;try{await cloudPush(true)}catch(e){}await CLOUD.auth.signOut()}
function renderCloud(){$('cloudBtn').textContent=CLOUD.user?'☁ '+(CLOUD.user.displayName||'Compte').split(' ')[0]:'☁ Compte';if(!$('modal').hidden&&$('mbody').dataset.cloud)openCloud()}
function openCloud(){openModal(`<h2>Compte et sauvegarde</h2>${!cloudReady()?'<p>La connexion Google sera activée dès que le projet Firebase du jeu sera créé.</p><p>En attendant, ta partie est sauvegardée automatiquement dans ce navigateur.</p>':CLOUD.user?`<p>Connecté en tant que <b>${esc(CLOUD.user.displayName||CLOUD.user.email||'')}</b>. Ta partie est sauvegardée en ligne.</p><button data-act="signOut">Se déconnecter</button>`:'<p>Connecte-toi pour retrouver ta partie sur tous tes appareils.</p><button class="go" data-act="signIn">Se connecter avec Google</button>'}${CLOUD.err?'<p style="color:#c0392b">'+CLOUD.err+'</p>':''}<p class="muted">${VERSION}</p>`);$('mbody').dataset.cloud=1}

/* ---------- démarrage ---------- */
SAVE=loadSave();
tick();
showTab('nursery');renderTop();
if(!SAVE.mons.length)starterModal();else if(SAVE.tuto>=1&&SAVE.tuto<6)setTip(TUTO[SAVE.tuto]);
setInterval(tick,500);
setInterval(saveGame,5000);
window.addEventListener('beforeunload',()=>{try{localStorage.setItem(SAVEKEY,saveJson())}catch(e){}});
requestAnimationFrame(frame);
cloudInit();
