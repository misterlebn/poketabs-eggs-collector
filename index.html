<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokeTabs Eggs Collector</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="apple-touch-icon" href="assets/logo.svg">
<style>
:root{--ink:#4a2f22;--paper:#fff8ee;--cream:#f6e9d8;--gold:#f2b632;--blue:#5f9be8;--red:#e0604f;--green:#5fb86a;--pink:#ef8fb6;--shadow:0 3px 0 #4a2f22}
*{box-sizing:border-box}
body{margin:0;background:#e9d6bf;color:var(--ink);font:600 14px/1.35 "Trebuchet MS",Verdana,sans-serif}
img{image-rendering:pixelated}
button{font:inherit;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:10px;padding:5px 10px;cursor:pointer;box-shadow:var(--shadow)}
button:hover{background:#fff3c9}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
button.go{background:var(--gold)}
button.sm{padding:2px 7px;font-size:12px;border-width:2px;border-radius:8px;box-shadow:0 2px 0 var(--ink)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;background:var(--paper);border-bottom:4px solid var(--ink);position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:8px}.logoic{width:40px;height:40px;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.25))}.logo>div{font:900 22px/1 "Trebuchet MS",sans-serif;letter-spacing:1px;color:var(--red);text-shadow:2px 2px 0 var(--ink)}
.logo span{display:block;font-size:12px;color:var(--blue);letter-spacing:3px;text-shadow:1px 1px 0 var(--ink)}
.stats{display:flex;gap:14px;font-size:15px}
.stats img{width:22px;height:22px;vertical-align:-5px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav button.on{background:var(--gold)}
main{max-width:1180px;margin:0 auto;padding:14px}
section[hidden]{display:none}
h3{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:10px}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:14px;padding:12px;box-shadow:0 5px 0 var(--ink)}
/* ---------- nurserie ---------- */
.room{border:4px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:0 6px 0 var(--ink)}
.wall{min-height:22px;padding:4px;display:flex;justify-content:center;gap:6px;background:linear-gradient(#f9e3d3,#f3cfba);border-bottom:6px solid #c99a7a;position:relative}
.wall .deco{position:absolute;bottom:0}
.floor{background:repeating-linear-gradient(90deg,#d7a874 0 58px,#cf9e69 58px 60px),#d7a874;padding:14px;display:grid;gap:14px}
.zone{background:rgba(255,248,238,.88);border:3px solid var(--ink);border-radius:12px;padding:10px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.st{position:relative;width:170px;min-height:180px;background:rgba(255,255,255,.55);border:3px dashed #b88a63;border-radius:12px;padding:6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.st:hover{border-color:var(--ink);background:#fff}
.st .lvl{position:absolute;top:4px;left:6px;font-size:11px;background:var(--ink);color:#fff;border-radius:6px;padding:1px 6px}
.st .cap{font-size:11px;min-height:28px;margin-top:4px}
.bar{width:100%;height:9px;border:2px solid var(--ink);border-radius:6px;background:#fff;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:0;background:var(--green)}
.bar.xp i{background:var(--blue)}
.nest .base{width:140px}
.nest .pair{position:absolute;bottom:58px;display:flex;gap:0;z-index:2}
.egg{display:inline-block;position:relative;overflow:hidden;flex:none;vertical-align:middle}
.egg img{position:absolute;max-width:none}
.egg .ck{position:absolute;left:0;top:0;width:100%;height:100%;background:url(sprites/Graphics/Battlers/Eggs/000_cracks.png) no-repeat;image-rendering:pixelated}
.egg-ico{position:absolute;cursor:pointer;top:6px;width:46px;z-index:3;animation:bob 1s ease-in-out infinite;filter:drop-shadow(0 0 6px #fff7a8)}
.egg-ico::after{content:""}
@keyframes bob{50%{transform:translateY(-7px)}}
.readyTag{position:absolute;top:2px;right:6px;font-size:11px;background:var(--gold);border:2px solid var(--ink);border-radius:8px;padding:0 5px}
.spr{display:inline-block;overflow:hidden;position:relative;flex:none}
.spr img{position:absolute;left:0;top:0;animation:walk .8s steps(4) infinite}
.spr.still img{animation:none}
.spr.miss{background:radial-gradient(circle,#ccc 40%,transparent 42%)}
.spr.miss img{display:none}
@keyframes walk{to{left:var(--w)}}
.inc .base{width:84px;height:135px;background:url(assets/incubators.png) no-repeat;background-size:672px 135px;position:relative}
.inc .eggs{position:absolute;left:11px;right:11px;bottom:22px;display:flex;flex-wrap:wrap-reverse;justify-content:center;gap:1px}
.egg.ok{animation:wig .5s ease-in-out infinite}
@keyframes wig{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.ball .base{height:96px}
.ball .trainees{display:flex;gap:2px;position:absolute;bottom:58px}
.ball .trainees .spr{animation:punch .45s ease-in-out infinite alternate}
@keyframes punch{to{transform:translateX(6px)}}
.eggbag{display:flex;flex-wrap:wrap;gap:6px}
.eggchip{display:flex;flex-direction:column;align-items:center;width:64px;font-size:10px;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:3px}

/* ---------- cartes ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px}
.card{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px}
.card.pick{cursor:pointer}
.card.pick:hover{background:#fff3c9}
.card.busy{opacity:.55}
.card.sel{outline:4px solid var(--gold)}
.card .nm{font-size:14px}
.card .sh{position:absolute;top:4px;right:6px;color:#e8a400}
.card .tag{position:absolute;top:4px;left:6px;font-size:10px;background:#eee;border-radius:6px;padding:0 5px}
.types{display:flex;gap:3px}
.ty{font-size:10px;color:#fff;border-radius:6px;padding:0 6px;text-shadow:1px 1px 0 rgba(0,0,0,.35)}
.genes{display:grid;grid-template-columns:auto 1fr;gap:1px 5px;width:100%;font-size:10px;align-items:center}
.genes b{display:block;height:5px;background:#eee;border-radius:3px;overflow:hidden}
.genes b i{display:block;height:100%;background:var(--pink)}
.mut{color:#c03cff}
.ttl{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;border:2px solid var(--ink);margin-right:5px;vertical-align:middle;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.ttl.c0{background:#8a8a8a}.ttl.c1{background:#4aa35a}.ttl.c2{background:#3a7bd5}.ttl.c3{background:#9a4ad5}.ttl.c4{background:linear-gradient(90deg,#f0a020,#e04a4a)}
.rank{width:100%;border-collapse:collapse;background:#fff;border:3px solid var(--ink);border-radius:10px;overflow:hidden}
.rank th,.rank td{padding:7px 9px;border-bottom:2px solid #e8dcc8;text-align:left;font-size:14px}.rank th{background:#f3e6cf}
.rank tr.me td{background:#fff6d0}.rank .pl{background:none;border:0;padding:0;box-shadow:none;font:inherit;font-weight:800;color:#2a5bb0;cursor:pointer;text-decoration:underline}
.rank td.n{width:48px;font-weight:800;text-align:center}
.pmons{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px;max-height:46vh;overflow:auto;margin-top:8px}
.pmon{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:4px;text-align:center;font-size:11px;display:flex;flex-direction:column;align-items:center}
.pstats{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.pstats span{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:3px 8px;font-size:13px}
.ttlpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.ttlpick button{padding:4px 6px}.ttlpick button.sel{outline:3px solid #f0a020}
.favb{position:absolute;left:4px;top:26px;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 5px;font-size:15px;line-height:22px;box-shadow:none;cursor:pointer;z-index:2}.favb.on{background:#fff3b0}
.selbar{position:sticky;top:64px;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin:8px 0}.dash div{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:8px;text-align:center}.dash b{display:block;font-size:22px}.dash span{font-size:12px;color:#7a6a58}
.setrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:2px dashed #e0d2bc}.setrow label{min-width:220px;font-weight:700}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;margin-left:8px;cursor:pointer}.chk input{width:16px;height:16px}
.filt{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.filt input{flex:1 1 180px;min-width:140px;padding:6px 8px;border:2px solid var(--ink);border-radius:8px;font:inherit}.filt select{padding:5px;border:2px solid var(--ink);border-radius:8px;font:inherit;background:#fff}
.eggchip.newegg{outline:3px solid #f0a020}
#roster .filt{flex:1 1 100%;margin:0 0 6px}
.presets{display:flex;flex-direction:column;gap:4px;max-height:60vh;overflow:auto}.pre{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:4px 8px}.pre .pbtn{margin-left:auto;display:flex;gap:4px}.pmini{display:flex;flex-wrap:wrap;max-width:100%}.aplace{min-width:0;overflow:hidden}.aplace .pmini .spr{margin:-2px}
.armoire{background:linear-gradient(#8a5a34,#6e4526);border:4px solid #3e2414;border-radius:10px;padding:6px 10px 10px;margin:8px 0 12px;max-width:560px;box-shadow:inset 0 0 0 3px #a8744a}
.armoire .atop{color:#ffe9c4;font-weight:800;text-align:center;margin-bottom:4px}
.aplank{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-bottom:8px solid #4a2c18;padding:6px 4px 2px;background:rgba(0,0,0,.18);margin-bottom:6px;border-radius:4px}
.aslot{display:flex;flex-direction:column;align-items:center;font-size:10px;color:#fff3dc;min-height:66px;cursor:pointer}.aslot.empty{cursor:default}
.eggsil img,.eggsil span{filter:brightness(0) opacity(.25)}
.edc button{margin-top:3px;font-size:10px;padding:2px 5px}
.pname{font-weight:800}.cpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.cpick button.sel{outline:3px solid #f0a020}
.synbar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;width:100%;margin-top:4px}.syn{font-size:12px;font-weight:700;background:#fff;border:2px solid;border-radius:8px;padding:2px 6px;opacity:.6}.syn.on{opacity:1;background:#fff6d0}
.itic{image-rendering:pixelated;vertical-align:middle}.hapbar{display:inline-block;width:120px;height:10px;border:2px solid var(--ink);border-radius:6px;background:#fff;vertical-align:middle;overflow:hidden}.hapbar i{display:block;height:100%;background:linear-gradient(90deg,#ff9ab8,#ff4a7a)}.evl{margin:2px 0 6px 18px;font-size:13px}
.dexrw{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}.drw{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:4px 8px;font-size:11px;min-width:96px;text-align:center;opacity:.6}.drw.ready{opacity:1;background:#fff6d0}.drw.got{opacity:.9;background:#e6f6e0}.drw b{font-size:15px}
.gmx{display:inline-block;width:160px;height:160px;background-size:640px 640px;background-repeat:no-repeat;image-rendering:pixelated;filter:drop-shadow(0 0 10px #ff4fa0)}
.cabw .aslot{position:relative;cursor:pointer}.cabw .aslot.empty{cursor:pointer}
.invgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}.invit{display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:6px;text-align:center;font-size:12px}
.arena{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}.aplace{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}.aplace.master{background:linear-gradient(#ffe9a0,#fff)}.aplace.c4{background:linear-gradient(#e6dcff,#fff)}.aplace.top{background:linear-gradient(#fff6d0,#fff)}.aplace.me{outline:3px solid #2f8f3a}.anum{font-weight:900;color:var(--red)}
.auc .pl,.aplace .pl{background:none;border:0;padding:0;box-shadow:none;font:inherit;font-weight:800;cursor:pointer;text-decoration:underline}.auc{display:flex;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:6px}.auc.lead{outline:3px solid #2f8f3a}.ainfo{display:flex;flex-direction:column;gap:4px;font-size:13px}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.ach{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px;opacity:.75}
.ach.ok{opacity:1;background:#fff8d8;border-color:#b8860b}
.ach .ai{font-size:28px}
.ach .at{display:flex;flex-direction:column;gap:2px;font-size:12px;flex:1}
.ach .at b{font-size:14px}
.ach .price img{width:14px;height:14px}
.pkb{position:absolute;top:22px;right:4px;font-size:9px;font-weight:900;color:#fff;background:#d6338a;border-radius:6px;padding:0 5px;letter-spacing:.5px}
.banner.pk{background:#ffd1e8}
/* ---------- combat ---------- */
.bhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bhrow{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;width:100%}.bhrow.syn{justify-content:flex-start;gap:6px}
.bhg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 8px;border:2px solid #dcc6a4;border-radius:12px;background:rgba(255,250,240,.7)}.bhg .lab{font-size:11px;font-weight:800;color:#9a7550;text-transform:uppercase;letter-spacing:.5px}
.autosel{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:8px 0;padding:8px;border:2px dashed #e0a030;border-radius:10px;background:#fffaf0}.autosel label{white-space:nowrap}
.bhead .title{font-size:18px}
.biome{font-size:12px;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:2px 8px}
body.fs main{max-width:none}body.fs{overflow:auto}
body.bfull header{display:none}
body.bfull main{max-width:none;padding:6px 10px;height:100vh;overflow:hidden}
body.bfull #tab-battle{display:flex;flex-direction:column;height:100%}
body.bfull .bhead{margin-bottom:6px;flex:none}
body.bfull #bcv{flex:1;min-height:0;width:100%;height:100%;max-width:none;object-fit:contain;background:#2a1a12}
body.bfull .roster{flex:none;padding:6px 2px}
#bcv{width:100%;max-width:1152px;border:4px solid var(--ink);border-radius:12px;display:block;background:#7cc46a;image-rendering:pixelated;cursor:crosshair}
.roster{display:flex;gap:8px;overflow-x:auto;padding:10px 2px}
.rcard{flex:none;width:92px;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:4px;text-align:center;font-size:11px;cursor:pointer}
.rcard.sel{background:var(--gold)}
.rcard.on{opacity:.4}
.rcard.busy{opacity:.3;cursor:not-allowed}
/* ---------- boutique ---------- */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.item{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center}
.item .ic{width:56px;height:56px;display:flex;align-items:center;justify-content:center;flex:none}
.item .ic img{max-width:56px;max-height:56px}
.item .ic .egg img{max-width:none;max-height:none}
.market{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mk{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;text-align:center;position:relative}
.mk b{font-size:12px}
.mk.leg{background:linear-gradient(#fff8d8,#fff);border-color:#b8860b}
.mk .lg{position:absolute;top:3px;left:4px;font-size:9px;background:#f2b632;border:1px solid var(--ink);border-radius:5px;padding:0 4px}
.playfield{position:relative;isolation:isolate;height:220px;border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at center,#f6dcc0 0 55%,#ecc9a2 56% 100%);border:3px solid #c99a7a}
.walker{position:absolute;left:0;top:0;cursor:pointer;will-change:transform}
.walker::before{content:"";position:absolute;left:16px;bottom:4px;width:24px;height:7px;border-radius:50%;background:rgba(0,0,0,.18)}
.walker:hover .spr{filter:drop-shadow(0 0 4px #fff)}
.pdeco{position:absolute;pointer-events:none}
.hearts{position:absolute;bottom:112px;left:50%;transform:translateX(-50%);width:64px;height:30px;pointer-events:none;z-index:3}
.hearts span{position:absolute;bottom:0;color:#ff5c8a;font-size:15px;opacity:0;animation:heart 2.4s ease-out infinite;text-shadow:0 1px 0 #7a2040}
.hearts span:nth-child(1){left:8px}.hearts span:nth-child(2){left:26px;animation-delay:.8s}.hearts span:nth-child(3){left:44px;animation-delay:1.6s}
@keyframes heart{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-28px) scale(1.15)}}
.item .tx{flex:1;font-size:12px}
.item .tx b{font-size:14px;display:block}
.price{display:inline-flex;align-items:center;gap:3px}
.price img{width:16px;height:16px}
/* ---------- pokédex ---------- */
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.dc{background:#fff;border:2px solid var(--ink);border-radius:8px;text-align:center;font-size:9px;padding:2px;cursor:pointer;position:relative}
.dc .spr{margin:0 auto}
.dc.un .spr img{filter:brightness(0);opacity:.3}
.dc.seen .spr img{filter:grayscale(1);opacity:.6}
.dc .s{position:absolute;top:0;right:2px;color:#e8a400}
/* ---------- modale, toasts ---------- */
#modal{position:fixed;inset:0;background:rgba(40,25,15,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
#modal[hidden]{display:none}
.mbox{background:var(--paper);border:4px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 var(--ink);max-width:900px;width:100%;max-height:88vh;overflow:auto;padding:16px;position:relative}
.mbox .x{position:absolute;top:8px;right:8px}
.mbox h2{margin:0 0 10px}
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:60}
.toast{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:8px 12px;box-shadow:var(--shadow);animation:tin .25s}
@keyframes tin{from{transform:translateX(40px);opacity:0}}
#tip{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#fffbe0;border:3px solid var(--ink);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);z-index:40;max-width:560px;display:flex;gap:10px;align-items:center}
#tip[hidden]{display:none}
.hatch{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.banner{font-weight:900;padding:2px 8px;border-radius:8px;border:2px solid var(--ink)}
.banner.m{background:#f0d6ff}
.banner.s{background:#fff1a8}
.muted{opacity:.7;font-size:12px}
.flexr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.slotrow{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:6px;margin-bottom:6px}

.slotrow .bar{flex:1}
.mvtag{display:inline-block;padding:2px 8px;margin:1px 2px;border-radius:10px;background:#f3e6cf;border:1px solid #c9a97a;font-size:12px;font-weight:600}
.alog{list-style:none;padding:0;margin:0}.alog li{padding:4px 8px;border-bottom:1px dashed #d8c4a0;font-size:13px}.alog li.me{background:#fff3c4;border-radius:6px}
#home{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:#2a1f4a url('assets/bg_menu.jpg') center/cover no-repeat;padding:16px;overflow:auto}
#home .hbox{background:rgba(255,248,234,.92)!important;backdrop-filter:blur(2px)}
#home .hbox{background:var(--paper,#fff8ea);border:4px solid var(--ink,#3a2a1a);border-radius:18px;padding:26px 30px;max-width:460px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:0 10px 0 rgba(0,0,0,.15)}
#home[hidden],#tour[hidden]{display:none}#home .hlogo{width:84px}#home h1{margin:0;font-size:30px;letter-spacing:2px;line-height:1}#home h1 span{display:block;font-size:15px;letter-spacing:4px;color:#b06a20}
#home button.big{width:100%;font-size:17px;padding:12px}#home .hlang{display:flex;gap:6px}#home .small{font-size:12px}

function expCollect(i){const x=(SAVE.exps||[])[i];if(!x||!x.done)return;const bi=BIOMES[x.bi],h=x.dur/3600000,M=x.mons.map(mon).filter(Boolean);
  const avg=M.reduce((a,m)=>a+m.lv,0)/Math.max(1,M.length),pw=M.length/3;

  SAVE.coins+=sold;let it=null;if(rnd()<Math.min(.9,.12*h)){it=rollItem();invAdd(it)}

const MIS=[['hatch','Faire éclore {n} œufs',5],['wins','Gagner {n} combats',10],['boss','Vaincre {n} boss',2],['lay','Récupérer {n} œufs dans les nids',6],['train','Terminer {n} entraînements',2],['exp','Terminer {n} expédition',1],['evo','Faire évoluer {n} Pokémon',2],['buy','Acheter {n} œufs',2],['bt','Vaincre un boss de type {t}',1]];
const dayKey=()=>{const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()};
function daily(){const k=dayKey();if(!SAVE.daily||SAVE.daily.day!==k){const R=rng(k*31+(SAVE.created||7)%997);const pool=MIS.slice();const list=[];
  while(list.length<3){const m=pool.splice(Math.floor(R()*pool.length),1)[0];let key=m[0],txt=m[1],goal=m[2];
    if(key==='bt'){const t=TYPES_ALL[Math.floor(R()*TYPES_ALL.length)];key='bt_'+t;txt=txt.replace('{t}',TNAME[t]||t)}
    list.push({key,txt:txt.replace('{n}',goal),goal,base:SAVE.st[key]||0,claimed:false})}
  SAVE.daily={day:k,list,bonus:false}}return SAVE.daily}
const misProg=x=>Math.min(x.goal,(SAVE.st[x.key]||0)-x.base);
const misReward=()=>rp(400+30*Math.min(SAVE.best,500));
function misClaim(i){const D=daily(),x=D.list[i];if(!x||x.claimed||misProg(x)<x.goal)return;x.claimed=true;const c=misReward();SAVE.coins+=c;let it=null;if(rnd()<.4){it=rollItem();invAdd(it)}
  toast(`🎯 Mission réussie : +${fmt(c)} pièces${it?' et '+ITEMS[it].n:''}`);dirty=true;saveGame();renderTop();renderAdv()}
function misBonus(){const D=daily();if(D.bonus||!D.list.every(x=>x.claimed))return;if(bagFull()){bagMsg();return}D.bonus=true;const e=superEgg();e.lv=15;addEgg(e);toast(`🎁 Bonus du jour : un super œuf rare de ${esc(DEX[e.n].name)} niveau 15 !`);dirty=true;saveGame();renderAdv()}

const snapMon=m=>({n:m.n,lv:m.lv,g:Object.assign({},m.g),sh:!!m.sh,mut:m.mut||0,bst:m.bst||null,pk:!!m.pk,sx:m.sx||'',hap:m.hap==null?70:m.hap});

/* ---------- arène : Maître, Conseil 4, 8 champions, 1 expert par type ---------- */
const NARENA=8;
const ARENA={map:null,busy:false,err:'',t:0};
const SEATS_CH=Array.from({length:NARENA},(_,k)=>'p'+(k+1)),SEATS_C4=['c1','c2','c3','c4'];
const seatKind=id=>id==='master'?'master':id[0]==='c'?'c4':id[0]==='p'?'champ':'expert';
const seatType=id=>id.startsWith('x_')?id.slice(2):null;
const seatLabel=id=>{const k=seatKind(id);return k==='master'?'Maître':k==='c4'?'Conseil 4 ('+id.slice(1)+')':k==='champ'?'Champion d\'arène ('+id.slice(1)+')':'Expert '+(TNAME[seatType(id)]||seatType(id))};
/* règle d'équipe de chaque place : experts = un seul type, légendaires permis ; champions et Conseil 4 = équipe d'un seul type sans légendaire ; Maître = sans légendaire */
const seatRule=id=>{const k=seatKind(id);return k==='expert'?{type:seatType(id),mono:true,nolegend:false}:k==='master'?{mono:false,nolegend:false,maxLeg:1}:{mono:false,nolegend:true}};
const ruleTxt=r=>(r.type?'équipe 100 % '+(TNAME[r.type]||r.type):r.mono?'équipe d\'un seul type':'types libres')+(r.nolegend?', sans légendaire':r.maxLeg?', 1 légendaire maximum':', légendaires permis');
const monthKey=()=>new Date().toISOString().slice(0,7);
async function arenaLoad(force){if(!CLOUD.db||ARENA.busy)return;if(!force&&ARENA.map&&Date.now()-ARENA.t<20000)return;ARENA.busy=true;
  try{let q=await CLOUD.db.collection('arena').get();let M={};q.docs.forEach(d=>M[d.id]=Object.assign({id:d.id},d.data()));
    if(!M.meta||M.meta.month!==monthKey()){await arenaMonthly(M);q=await CLOUD.db.collection('arena').get();M={};q.docs.forEach(d=>M[d.id]=Object.assign({id:d.id},d.data()))}
    if(!M.meta||M.meta.pnj!==2){const col=CLOUD.db.collection('arena');for(const id of Object.keys(M))if(id!=='meta'&&M[id]&&M[id].auto){await col.doc(id).delete();delete M[id]}
      await col.doc('meta').set({pnj:2},{merge:true});if(M.meta)M.meta.pnj=2}
    ARENA.map=M;ARENA.err='';ARENA.t=Date.now();arenaAccrue();arenaNotify()}
  catch(e){ARENA.err=errKind(e)}ARENA.busy=false;if(cur==='rank'&&onlineMode==='arena')renderRank()}
/* nouveau mois : les champions sont destitués ; personne n'est placé automatiquement */
async function arenaMonthly(M){const col=CLOUD.db.collection('arena'),first=!M.meta;
  await col.doc('meta').set({month:monthKey(),at:Date.now(),pnj:2},{merge:true});
  if(!first)for(const id of SEATS_CH)if(M[id])await col.doc(id).delete()}
/* bots : occupent les places libres avec une équipe plutôt faible, jusqu'à ce qu'un joueur les batte */
const BOT_NAMES=['Léo','Mila','Hugo','Zoé','Nina','Tom','Lina','Max','Eva','Noé','Jade','Sam','Lou','Axel','Iris','Paul','Rose','Yanis','Clara','Enzo','Lisa','Malo','Inès','Théo','Anna','Rayan','Lucie'];
/* boss PNJ du siège de Maître : équipe de 12 Pokémon finaux parmi les plus puissants (sans légendaire), niveau 85 */
function bossMaster(){const R=rng(424242);
  const P=[...AVAIL].filter(n=>DEX[n]&&!LEGEND.has(n)&&n!==132&&!evoTargets(n).length).sort((a,b)=>{const t=d=>d.hp+d.atk+d.def+d.spd+d.spa;return t(DEX[b])-t(DEX[a])}).slice(0,40);
  const pool=P.slice(),team=[];for(let i=0;i<12&&pool.length;i++){const n=pool.splice(Math.floor(R()*pool.length),1)[0],g={};GK.forEach(x=>g[x]=Math.floor(18+R()*14));team.push({n,lv:83+Math.floor(R()*5),g,sh:false,x:(PZ-1-(i%3)*2)*TW+TW/2,y:(3+Math.floor(i/3)*3)%(GH-2)*TW+TW/2})}
  return{id:'master',uid:'pnj_master',bot:true,pnj:true,name:'Maître de la Ligue',title:'Boss PNJ',color:'base',team,wins:0}}
function botFor(id){if(id==='master')return bossMaster();const k=seatKind(id),h=[...(id+monthKey())].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7),R=rng(h);
  const lv=k==='master'?70:k==='c4'?55:k==='champ'?30:35,size=k==='master'?10:k==='c4'?8:k==='champ'?5:6;
  const rule=seatRule(id);let ty=rule.type||(rule.mono?TYPES_ALL[Math.floor(R()*TYPES_ALL.length)]:null);
  let P=[...AVAIL].filter(n=>DEX[n]&&!LEGEND.has(n)&&n!==132&&(!ty||DEX[n].t1===ty||DEX[n].t2===ty));if(P.length<3){P=[...AVAIL].filter(n=>DEX[n]&&!LEGEND.has(n)&&n!==132);ty=null}
  const team=[];for(let i=0;i<size;i++){const n=P[Math.floor(R()*P.length)],g={};GK.forEach(x=>g[x]=Math.floor(4+R()*12));team.push({n,lv:Math.max(5,lv+Math.floor(R()*7)-3),g,sh:false,x:(PZ-1-(i%3)*2)*TW+TW/2,y:(3+Math.floor(i/3)*3)%(GH-2)*TW+TW/2})}
  return{id,uid:'bot_'+id,bot:true,name:'Bot '+BOT_NAMES[h%BOT_NAMES.length],title:k==='master'?'Maître intérimaire':k==='c4'?'Membre intérimaire':k==='champ'?'Champion intérimaire':'Expert intérimaire',color:'base',team,wins:0}}
const seatX=id=>(ARENA.map&&ARENA.map[id])||botFor(id);
const seatOf=uid=>{const M=ARENA.map||{};return Object.keys(M).filter(id=>id!=='meta'&&M[id]&&M[id].uid===uid)};
const myLadder=()=>CLOUD.user?seatOf(CLOUD.user.uid).find(id=>seatKind(id)!=='expert')||null:null;
const myExpert=()=>CLOUD.user?seatOf(CLOUD.user.uid).find(id=>seatKind(id)==='expert')||null:null;
/* meilleure équipe possible pour une règle (pour prendre une place libre ou mettre à jour la sienne) */
function bestTeam(rule){const now=Date.now();let L=SAVE.mons.filter(m=>!(rule.nolegend&&LEGEND.has(m.n))&&!(m.rest>now)&&!(m.ko>now));
  const top=A=>{let nl=0;return A.slice().sort((a,b)=>pc(b)-pc(a)).filter(m=>!(rule.maxLeg&&LEGEND.has(m.n)&&++nl>rule.maxLeg)).slice(0,SAVE.army)};
  if(rule.type)L=L.filter(m=>DEX[m.n].t1===rule.type||DEX[m.n].t2===rule.type);
  else if(rule.mono){let best=[],bs=-1;TYPES_ALL.forEach(t=>{const T=top(L.filter(m=>DEX[m.n].t1===t||DEX[m.n].t2===t));const sc=T.reduce((a,m)=>a+pc(m),0);if(sc>bs){bs=sc;best=T}});L=best}

const I18N={obs:null,busy:false};
function trNode(n){const v=n.nodeValue;if(!v||!/\S/.test(v))return;const t=v.trim();let o=EN[t];if(o!=null){if(o!==t)n.nodeValue=v.replace(t,o);return}let w=v;for(const[r,x]of EN_W)w=w.replace(r,x);if(w!==v)n.nodeValue=w}
function trTree(root){if(LG()!=='en')return;if(root.nodeType===3){trNode(root);return}if(root.nodeType!==1||root.id==='home'||root.closest&&root.closest('#home'))return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(n.parentNode&&/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName))continue;trNode(n)}
  root.querySelectorAll&&root.querySelectorAll('[title],[placeholder]').forEach(e=>{['title','placeholder'].forEach(a=>{const v=e.getAttribute(a);if(v&&EN[v])e.setAttribute(a,EN[v])})})}
function i18nInit(){document.documentElement.lang=LG();if(I18N.obs){I18N.obs.disconnect();I18N.obs=null}if(LG()!=='en')return;trTree(document.body);
  I18N.obs=new MutationObserver(L=>{if(I18N.busy)return;I18N.busy=true;try{for(const m of L){if(m.type==='characterData')trNode(m.target);else m.addedNodes.forEach(trTree)}}finally{I18N.busy=false}});
  I18N.obs.observe(document.body,{childList:true,subtree:true,characterData:true})}
function setLang(k){const was=LG();OPT.lang=k;saveOpt();if(was==='en'&&k==='fr'){location.reload();return}i18nInit();homeRender();if(cur==='settings')renderSettings();if(TOUR.on)tourRender()}

const TOUR_STEPS=[
 {tab:'nursery',t:['🥚 Nurserie','🥚 Nursery'],x:['Le cœur du jeu. <b>Nids</b> : place un couple (mâle + femelle, ou avec Métamorph) pour qu\'il ponde des œufs. <b>Incubateurs</b> : mets-y les œufs pour les faire éclore. <b>Entraînement</b> : les punching-balls donnent de l\'XP à tes Pokémon (bouton ⚡ pour remplir tout seul). <b>Armoire</b> : expose tes plus beaux œufs. <b>Sac d\'œufs</b> : tes œufs en attente, que tu peux aussi vendre.','The heart of the game. <b>Nests</b>: place a pair (male + female, or with Ditto) to lay eggs. <b>Incubators</b>: put eggs there to hatch them. <b>Training</b>: punching bags give XP to your Pokémon (⚡ button fills them for you). <b>Cabinet</b>: show off your best eggs. <b>Egg bag</b>: your waiting eggs, which you can also sell.']},
 {tab:'team',t:['📋 Pokémon','📋 Pokémon'],x:['Tous tes Pokémon. Clique sur <b>📋 Fiche</b> pour voir son talent, ses déplacements (vol, nage, lave), lui donner un objet ou le faire évoluer. <b>⭐</b> = favori. <b>☑ Sélectionner plusieurs</b> permet de relâcher en lot avec des filtres (doublons, niveau, type…).','All your Pokémon. Click <b>📋 Info</b> to see its ability and movement (fly, swim, lava), give it an item or evolve it. <b>⭐</b> = favorite. <b>☑ Select several</b> lets you release many at once with filters (duplicates, level, type…).']},
 {tab:'battle',t:['⚔ Combat','⚔ Battle'],x:['Avance de tableau en tableau. Glisse tes Pokémon dans la zone bleue (ou <b>Placement auto</b>), puis <b>⚔ Combat !</b> Les combats sont automatiques et durent 2 minutes au plus. Clique sur un ennemi pour en faire la cible principale. Attention au terrain : eau, lave, boue et falaises. Un boss tous les 5 tableaux donne des œufs.','Go from stage to stage. Drag your Pokémon into the blue zone (or <b>Auto place</b>), then <b>⚔ Fight!</b> Battles are automatic and last 2 minutes at most. Click an enemy to make it the main target. Watch the terrain: water, lava, mud and cliffs. A boss every 5 stages gives eggs.']},
 {tab:'shop',t:['🛒 Boutique','🛒 Shop'],x:['Achète des œufs (marché du jour, œufs du moment, légendaire du jour), des améliorations (nids, incubateurs, punching-balls, place dans l\'armée) et des objets. « Possédé » indique ce que tu as déjà.','Buy eggs (today\'s market, eggs of the moment, legendary of the day), upgrades (nests, incubators, punching bags, army slots) and items. "Owned" shows what you already have.']},

 {tab:'ach',t:['🏆 Succès','🏆 Achievements'],x:['Des objectifs qui rapportent des pièces et des titres à afficher à côté de ton nom.','Goals that give coins and titles to show next to your name.']},
 {tab:'adv',t:['🗺️ Aventures','🗺️ Adventures'],x:['<b>Expéditions</b> : envoie des Pokémon explorer un biome pendant quelques heures pour ramener du butin. <b>Missions du jour</b>, <b>tableaux défi</b>, et l\'<b>Antre Dynamax</b> : des boss géants à abattre à plusieurs combats.','<b>Expeditions</b>: send Pokémon to explore a biome for a few hours and bring back loot. <b>Daily missions</b>, <b>challenge stages</b>, and the <b>Dynamax den</b>: giant bosses to take down over several fights.']},
 {tab:'rank',t:['🌐 En ligne','🌐 Online'],x:['Avec un compte Google : le <b>classement</b>, l\'<b>arène</b> (champions d\'arène → Conseil 4 → Maître, des pièces par heure tant que tu tiens ta place, et les experts de type ont plus de shiny) et l\'<b>hôtel des ventes</b> pour échanger des Pokémon.','With a Google account: the <b>ranking</b>, the <b>arena</b> (gym leaders → Elite Four → Master, coins per hour while you hold your seat, and type experts get more shinies) and the <b>auction house</b> to trade Pokémon.']},
 {tab:'profile',t:['👤 Profil','👤 Profile'],x:['Ton compte, ton pseudo, ta couleur et ton titre.','Your account, nickname, colour and title.']},

const TOUR={on:false,i:0};
function tourStart(){TOUR.on=true;TOUR.i=0;tourRender()}
function tourRender(){let el=$('tour');if(!el){el=document.createElement('div');el.id='tour';document.body.appendChild(el)}const st=TOUR_STEPS[TOUR.i],L=LG()==='en'?1:0;
  document.querySelectorAll('nav button.tourhl').forEach(b=>b.classList.remove('tourhl'));const nb=document.querySelector(`nav button[data-tab="${st.tab}"]`);if(nb)nb.classList.add('tourhl');
  if(cur!==st.tab)showTab(st.tab);el.hidden=false;
  el.innerHTML=`<div class="tstep">${TOUR.i+1} / ${TOUR_STEPS.length}</div><h3>${st.t[L]}</h3><p>${st.x[L]}</p><div class="tbtn"><button class="sm" data-act="tourSkip">${tr2('Passer le tutoriel','Skip tutorial')}</button><span style="flex:1"></span>${TOUR.i?`<button class="sm" data-act="tourPrev">◀ ${tr2('Précédent','Previous')}</button>`:''}<button class="sm go" data-act="tourNext">${TOUR.i<TOUR_STEPS.length-1?tr2('Suivant','Next')+' ▶':tr2('Terminer','Finish')+' ✓'}</button></div>`}
function tourEnd(){TOUR.on=false;const el=$('tour');if(el)el.hidden=true;document.querySelectorAll('nav button.tourhl').forEach(b=>b.classList.remove('tourhl'));SAVE.tour=1;dirty=true;saveGame();showTab('nursery')}
Object.assign(ACT,{setLang:(t)=>setLang(t.dataset.v),homeEnter:()=>homeEnter(),homeGuest:()=>homeEnter(),homeGoogle:()=>{HOME.want=true;cloudSignIn()},homeOut:async()=>{HOME.want=true;try{await CLOUD.auth.signOut()}catch(e){}cloudSignIn()},
  tourStart:()=>tourStart(),tourSkip:()=>tourEnd(),tourNext:()=>{if(TOUR.i>=TOUR_STEPS.length-1)tourEnd();else{TOUR.i++;tourRender()}},tourPrev:()=>{TOUR.i=Math.max(0,TOUR.i-1);tourRender()}});

/* =====================================================================
   MANETTE : stick gauche ou croix = curseur, A = cliquer (maintenir pour glisser), B = retour / fermer,
   X = placement auto, Y = plein écran du combat, LB / RB = onglet précédent / suivant, Start = lancer le combat,
   stick droit = faire défiler
   ===================================================================== */
const GP={on:false,x:innerWidth/2,y:innerHeight/2,prev:[],down:false,hov:null,last:0,el:null};
const GP_TABS=()=>[...document.querySelectorAll('nav button[data-tab]')];
function gpEl(){if(!GP.el){GP.el=document.createElement('div');GP.el.id='gpc';document.body.appendChild(GP.el)}return GP.el}
function gpShow(){const c=gpEl();c.hidden=false;c.style.transform=`translate(${GP.x}px,${GP.y}px)`}
function gpTarget(){const c=gpEl();c.hidden=true;const e=document.elementFromPoint(GP.x,GP.y);c.hidden=false;return e}
function gpFire(type,el){if(!el)return;const o={bubbles:true,cancelable:true,clientX:GP.x,clientY:GP.y,button:0,buttons:type==='pointerup'?0:1,pointerId:7,isPrimary:true,pointerType:'mouse'};
  el.dispatchEvent(type.startsWith('pointer')?new PointerEvent(type,o):new MouseEvent(type,o))}
function gpScroll(dy){const e=gpTarget();let n=e;while(n&&n!==document.body){const cs=getComputedStyle(n);if(/(auto|scroll)/.test(cs.overflowY)&&n.scrollHeight>n.clientHeight+2){n.scrollTop+=dy;return}n=n.parentElement}scrollBy(0,dy)}
function gpTab(d){const T=GP_TABS().filter(b=>!b.hidden&&b.offsetParent);const i=T.findIndex(b=>b.dataset.tab===cur);const nb=T[(i+d+T.length)%T.length];if(nb)nb.click()}
function gpLoop(t){requestAnimationFrame(gpLoop);const P=navigator.getGamepads?[...navigator.getGamepads()].filter(Boolean):[];const g=P[0];if(!g)return;
  const dt=Math.min(.05,(t-(GP.last||t))/1000);GP.last=t;const b=g.buttons.map(x=>x.pressed),pr=i=>b[i]&&!GP.prev[i];const dz=v=>Math.abs(v)<.18?0:v;
  let ax=dz(g.axes[0]||0),ay=dz(g.axes[1]||0);if(b[14])ax=-1;if(b[15])ax=1;if(b[12])ay=-1;if(b[13])ay=1;
  const any=ax||ay||b.some(x=>x)||dz(g.axes[3]||0);if(any&&!GP.on){GP.on=true}
  if(GP.on){const sp=(b[6]||b[7]?1500:780)*dt;GP.x=clamp(GP.x+ax*Math.abs(ax)*sp*1.3,0,innerWidth-2);GP.y=clamp(GP.y+ay*Math.abs(ay)*sp*1.3,0,innerHeight-2);
    if(ay>.5&&GP.y>innerHeight-30)gpScroll(14);if(ay<-.5&&GP.y<30)gpScroll(-14);
    const ry=dz(g.axes[3]||0);if(ry)gpScroll(ry*22);
    if(ax||ay||any)gpShow();
    const h=gpTarget(),hv=h&&h.closest&&h.closest('[data-act],button,a,select,input,.card,nav button,canvas');if(hv!==GP.hov){if(GP.hov)GP.hov.classList.remove('gphov');GP.hov=hv;if(hv&&hv.tagName!=='CANVAS')hv.classList.add('gphov')}
    if(pr(0)){const e=gpTarget();GP.down=e;gpFire('pointerdown',e);gpFire('mousedown',e)}
    else if(b[0]&&GP.down&&(ax||ay)){gpFire('pointermove',gpTarget());gpFire('pointermove',window)}
    if(GP.prev[0]&&!b[0]&&GP.down){const e=gpTarget();gpFire('pointerup',e);window.dispatchEvent(new PointerEvent('pointerup',{clientX:GP.x,clientY:GP.y,bubbles:true,pointerId:7}));gpFire('mouseup',e);
      if(e){const tg=e.closest('select');if(tg){const n=tg.options.length;if(n){tg.selectedIndex=(tg.selectedIndex+1)%n;tg.dispatchEvent(new Event('change',{bubbles:true}));tg.dispatchEvent(new Event('input',{bubbles:true}))}}else if(/^(INPUT|TEXTAREA)$/.test(e.tagName)){e.focus()}else gpFire('click',e)}GP.down=null}
    if(pr(1)){const m=$('modal');if(m&&!m.hidden)closeModal();else if(TOUR.on)tourEnd();else if($('tip')&&!$('tip').hidden)$('tip').hidden=true;else if(document.body.classList.contains('bfull'))toggleBattleFull()}
    if(pr(2)&&cur==='battle'){const a=document.querySelector('[data-act="autoPlace"]');if(a&&!a.disabled)a.click()}
    if(pr(3)&&cur==='battle')toggleBattleFull();
    if(pr(4))gpTab(-1);if(pr(5))gpTab(1);
    if(pr(9)){if(HOME.on)homeEnter();else if(cur==='battle'){const a=document.querySelector('[data-act="fight"]');if(a&&!a.disabled)a.click()}}}
  GP.prev=b}

addEventListener('gamepaddisconnected',()=>{if(GP.el)GP.el.hidden=true;GP.on=false});
addEventListener('mousemove',e=>{if(e.isTrusted&&GP.on&&GP.el&&!GP.el.hidden&&Math.abs(e.movementX)+Math.abs(e.movementY)>2){GP.el.hidden=true;if(GP.hov){GP.hov.classList.remove('gphov');GP.hov=null}}});
